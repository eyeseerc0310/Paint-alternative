<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paint Alternative</title>
  <meta name="description" content="A free painting app that runs in your browser. Nothing is uploaded; Save downloads your picture.">
  <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1f" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css?v=cas-fast-20261028">
  <link rel="stylesheet" href="color-controls.css?v=6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paint">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // apply the light/dark choice before the page draws (no flash): the
    // visitor's own choice if they've made one, otherwise their device's
    var savedTheme = null;
    try { savedTheme = localStorage.getItem('theme-choice'); } catch (e) {}
    var wantDark = savedTheme ? savedTheme === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    if (wantDark) document.documentElement.setAttribute('data-theme', 'dark');
    try { if (localStorage.getItem('paint-ui-flipped') === 'true') document.documentElement.classList.add('ui-flipped'); } catch (e) {}
    document.documentElement.classList.add('js');
    if (navigator.maxTouchPoints > 0) document.documentElement.classList.add('touch');
    // (the top bar starts folded to a thin strip, unless it was left open)
    try { if (localStorage.getItem('paint-hdr-open') === '1') document.documentElement.classList.add('hdr-open'); } catch (e) {}
  </script>
</head>
<body>
  <!-- (the app's mark while it opens: it fades into the workspace once the drawing is back) -->
  <div class="app-splash" aria-hidden="true">
    <div class="splash-mark"><span class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg></span><span class="splash-name">Paint Alternative</span></div>
    <div class="splash-wait"><i></i></div>
  </div>
  <header class="site-header">
    <div class="brand">
      <h1 class="sr-only">Paint Alternative</h1>
    </div>
    <div class="header-tools" role="toolbar" aria-label="Picture" id="hdr-tools">
      <button type="button" class="hb hb-install" data-hb="install" hidden aria-label="Install app" title="Install as an app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><rect x="4.5" y="16.5" width="15" height="3.5" rx="1.2"/></svg><span>Install</span></button>
      <div class="hb-group hb-file" role="group" aria-label="File">
        <button data-tip="Gallery: all your drawings" type="button" class="hb" data-hb="gallery" aria-label="Gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
        <button data-tip="New picture (N)" type="button" class="hb" data-hb="new" aria-label="New picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13.5 3.5V9H19"/><path d="M12 12.5v5M9.5 15h5"/></svg></button>
        <label class="hb paint-open" data-hb="open" data-tip="Open a picture, or a project (.paint)"><input type="file" accept="image/*,.paint,.dng,.cr2,.cr3,.nef,.nrw,.arw,.raf,.orf,.rw2,.pef,.srw,.tif,.tiff,.heic,.heif" aria-label="Open a picture or a project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18v-8a1.5 1.5 0 0 0-1.5-1.5h-6.2L10.5 6H5.5A1.5 1.5 0 0 0 4 7.5z"/></svg></label>
        <button type="button" class="hb" data-act="save" aria-label="Save" aria-expanded="false" data-tip="Save: download as PNG, JPEG or a project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10.5"/><path d="M7.5 10L12 14.5 16.5 10"/><path d="M5 19.5h14"/></svg></button>
        <button data-tip="Share the picture" type="button" class="hb" data-hb="share" aria-label="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11"/><path d="M8 7.5l4-4 4 4"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.5"/></svg></button>
      </div>
      <span class="hb-sep hb-file" aria-hidden="true"></span>
      <div class="hb-group hb-pic" role="group" aria-label="Picture">
        <button data-tip="Crop, rotate, flip and clear" type="button" class="hb" data-hb="image" aria-label="Crop, rotate and flip" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3v14.5H21"/><path d="M3 6.5h14.5V21"/></svg></button>
        <button data-tip="History: every step, to go back to" type="button" class="hb" data-hb="history" aria-label="History" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5v3.8h3.8"/><path d="M12 8v4.5l3 2"/></svg></button>
      </div>
      <span class="hb-sep hb-view" aria-hidden="true"></span>
      <div class="hb-group hb-view" role="group" aria-label="View">
        <button type="button" class="hb" data-hb="guides" aria-label="Smart Guides" aria-pressed="true" data-tip="Smart Guides: what you move snaps to the middle of the picture, and to the edges and middles of what's on the other layers"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21"/></svg></button>
        <button type="button" class="hb" data-hb="focus" aria-label="Focus mode" aria-pressed="false" data-tip="Focus mode: just the picture (\)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/><path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg></button>
        <button type="button" class="hb" data-hb="settings" aria-label="Settings" aria-expanded="false" aria-haspopup="menu" data-tip="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.2-2 .9-2-.7-2.4 4.2 1.6 1.5v2.2l-1.6 1.5 2.4 4.2 2-.7 2 .9.6 2.2h5l.6-2.2 2-.9 2 .7 2.4-4.2-1.6-1.5v-2.2l1.6-1.5-2.4-4.2-2 .7-2-.9-.6-2.2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button data-tip="Keyboard shortcuts (?)" type="button" class="hb" data-hb="help" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2-2.4 3.6"/><path d="M12 17h.01"/></svg></button>
        <button class="theme-toggle" data-tip="Light or dark" type="button" aria-label="Switch to dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="icon-moon" d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>
          <g class="icon-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>
        </svg>
      </button>
      </div>
      <button type="button" class="hb hb-more" data-hb="more" aria-label="More" aria-expanded="false" data-tip="More"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg></button>
    </div>
    <button type="button" class="hdr-fold" aria-describedby="save-status" aria-controls="hdr-tools" aria-expanded="false" aria-label="Show the toolbar" data-tip="Show the toolbar"><span id="save-status" class="doc-status" data-state="saved" role="status" data-tip="Your drawing is kept in this browser as you go. Use Save to download a copy"><i aria-hidden="true"></i><span>Saved</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
  </header>
  <main class="site-main">
    <section class="paint" aria-label="Drawing">
      <div class="paint-bar paint-left" role="toolbar" aria-label="Tools">
        <div class="paint-toolgroups">
        <div class="paint-group" role="group" aria-label="Draw">
          <button type="button" data-tool="brush" aria-label="Brush (B)" data-tip="Brush (B): paint freehand. Choose the brush in the tool panel" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg></button>
          <button type="button" data-tool="eraser" aria-label="Eraser (E)" data-tip="Eraser (E): rub out paint on the current layer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20.5h12"/><path d="M5.3 15.3l8.9-8.9a2 2 0 0 1 2.8 0l2.6 2.6a2 2 0 0 1 0 2.8l-8.4 8.4a1 1 0 0 1-.7.3H8.4a1 1 0 0 1-.7-.3l-2.4-2.4a1.8 1.8 0 0 1 0-2.5z"/><path d="M9.4 11.2l5.4 5.4"/></svg></button>
          <button type="button" data-tool="fill" aria-label="Fill (F)" data-tip="Fill (F): tap to flood an area with colour"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 4.2l7.7 7.7-6.4 6.4a2 2 0 0 1-2.8 0l-4.9-4.9a2 2 0 0 1 0-2.8z"/><path d="M4.6 12.4h13.2"/><path d="M10.6 4.2L8.4 2"/><path d="M20.5 15.2c.9 1.3 1.5 2.3 1.5 3.1a1.5 1.5 0 0 1-3 0c0-.8.6-1.8 1.5-3.1z"/></svg></button>
          <button type="button" data-tool="gradient" aria-label="Gradient (G)" data-tip="Gradient (G): linear, radial, angular, diamond or freeform. Drag to make one, then move its handles and colour stops before it&#39;s laid down"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 7a3 3 0 0 1 3-3h2v16H7a3 3 0 0 1-3-3z" fill="currentColor" stroke="none"/><path d="M9 4h3.5v16H9z" fill="currentColor" opacity=".55" stroke="none"/><path d="M12.5 4H16v16h-3.5z" fill="currentColor" opacity=".22" stroke="none"/></svg></button>
          <button type="button" data-tool="picker" aria-label="Colour picker (I)" data-tip="Colour picker (I): tap the picture to grab a colour. Or hold Alt (Option) with any tool"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.6 4.6a2.7 2.7 0 0 1 3.8 0l1 1a2.7 2.7 0 0 1 0 3.8l-1.9 1.9.7.7-1.5 1.5-5.7-5.7 1.5-1.5.7.7z"/><path d="M11.9 9.6l-6.5 6.5a2 2 0 0 0-.6 1.4V19.2h1.7a2 2 0 0 0 1.4-.6l6.5-6.5"/></svg></button>
          <button type="button" class="paint-mirror" aria-pressed="false" aria-expanded="false" data-tip="Symmetry: whatever you draw is copied, mirrored or turned round a centre. Its settings open in the tool panel" aria-label="Symmetry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v17" stroke-dasharray="1.6 2.4"/><path d="M9 7L4 17h5z"/><path d="M15 7l5 10h-5z"/></svg></button>
        </div>
        <div class="paint-group" role="group" aria-label="Shapes and text">
          <button type="button" data-tool="shape" class="paint-shapebtn" aria-label="Shapes (R)" data-tip="Shapes (R): lines and shapes. Pick a line (L) or a shape, and outline or filled, in the tool panel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="11.5" width="8" height="8" rx="1.5"/><circle cx="16" cy="8" r="4.5"/><path d="M16.5 14.5l4 6h-8z"/></svg></button>
          <button type="button" data-tool="text" aria-label="Text (T)" data-tip="Text (T): tap to type, or drag a box for the words to wrap in. The words go on a layer of their own, and stay editable: tap them again to change them"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 7.5V5h13v2.5"/><path d="M12 5v14.5"/><path d="M9.5 19.5h5"/></svg></button>
          <button type="button" data-tool="pen" aria-label="Pen (P)" data-tip="Pen (P): click to place points joined by lines, drag to make curves. Click the first point to close the shape; Done (or Return) to finish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 4.2l6 6-2.7 6.3-7.6 3.3-3.4-3.4 3.3-7.6z"/><path d="M5 19l5.3-5.3"/><circle cx="11.6" cy="12.4" r="1.6"/></svg></button>
          <button type="button" data-tool="lasso" class="paint-selbtn" aria-label="Select" data-tip="Select: a cutout, a box, a circle or the magic wand. Choose which in the tool panel (keys Q, M, C, W)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.6C5.3 14.5 4 12.8 4 10.9 4 7.4 7.6 4.5 12 4.5s8 2.9 8 6.4-3.6 6.4-8 6.4c-1 0-1.9-.1-2.8-.4" stroke-dasharray="2.4 2.1"/><circle cx="8.4" cy="16.4" r="1.4"/><path d="M8 17.8c-.6 1.2-.2 2.3 1 2.7"/></svg></button>
        </div>
        <div class="paint-group" role="group" aria-label="Retouch">
          <button type="button" data-tool="smudge" class="paint-blendbtn" aria-label="Blend (S)" data-tip="Blend: smudge, blur, lighten or darken what you brush over. Pick which in the tool panel (keys S, U, O)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="12" r="5.5"/><circle cx="14.5" cy="12" r="5.5"/><path d="M12 7.3a5.5 5.5 0 0 1 0 9.4 5.5 5.5 0 0 1 0-9.4z" fill="currentColor" stroke="none" opacity=".45"/></svg></button>
          <button type="button" class="paint-adjust-btn" data-act="adjust" aria-expanded="false" aria-label="Effects (A)" data-tip="Effects (A): light, levels, curves, hue and saturation, white balance, gradient maps, sharpness and more, on the current layer (inside the selection, if there is one)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8.5M17.5 7H20M4 12h2.5M11.5 12H20M4 17h10.5M19.5 17h.5"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="17" r="2.2"/></svg></button>
        </div>
        <div class="paint-group" role="group" aria-label="Move and fit">
          <button type="button" data-tool="move" aria-label="Move (V)" data-tip="Move (V): picks up everything on the layer (or the words of a text layer) to move, size or turn it. Drag anywhere to move it"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v17M3.5 12h17"/><path d="M9.5 6L12 3.5 14.5 6M9.5 18l2.5 2.5 2.5-2.5M6 9.5L3.5 12 6 14.5M18 9.5l2.5 2.5-2.5 2.5"/></svg></button>
          <button type="button" data-zoom="fit" class="paint-fitbtn" aria-label="Fit the picture (0)" data-tip="Fit (0): the whole picture, upright"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M3.5 8V5a1.5 1.5 0 0 1 1.5-1.5h3M16 3.5h3A1.5 1.5 0 0 1 20.5 5v3M20.5 16v3a1.5 1.5 0 0 1-1.5 1.5h-3M8 20.5H5A1.5 1.5 0 0 1 3.5 19v-3"/></svg></button>
        </div>
        <div class="paint-group pl-view" role="group" aria-label="Layers and zoom">
          <button type="button" class="pl-layersbtn" data-act="layers" aria-label="Layers" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5"/><path d="M3.5 16.5L12 21l8.5-4.5" opacity=".6"/></svg><span>Layers</span></button>
          <div class="paint-zoom" role="group" aria-label="Zoom"><button type="button" data-zoom="out" aria-label="Zoom out" data-tip="Zoom out (−)">&#8722;</button><button type="button" data-zoom="fit" class="paint-zoom-val" data-tip="Fit (0)">100%</button><button type="button" data-zoom="in" aria-label="Zoom in" data-tip="Zoom in (+)">+</button></div>
        </div>
      </div>
      </div>
      <!-- (saved or not: in the corner under the tools) -->

      <div class="paint-centre">
        <!-- PAINT OR VECTOR: two workspaces in the one drawing -->
        <div class="mode-switch" role="radiogroup" aria-label="Workspace">
          <button type="button" role="radio" aria-checked="true" data-mode="paint" data-tip="Paint: brushes and pixels, on layers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg><span>Paint</span></button>
          <button type="button" role="radio" aria-checked="false" data-mode="vector" data-tip="Vector: shapes and paths that stay sharp at any size. Its own artboard, kept with this drawing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 18.5C7 11 13 8 18.5 5.5"/><path d="M5.5 18.5L13 15"/><rect x="3.5" y="16.5" width="4" height="4" rx="1"/><rect x="16.5" y="3.5" width="4" height="4" rx="1"/><circle cx="14" cy="14.6" r="1.3"/></svg><span>Vector</span></button>
          <button type="button" role="radio" aria-checked="false" data-mode="photo" data-tip="Photo: edit a photograph, RAW or JPEG, without changing the original"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="17" height="12.5" rx="2"/><path d="M8.5 6.5l1.4-2h4.2l1.4 2"/><circle cx="12" cy="12.7" r="3.3"/></svg><span>Photo</span></button>
        </div>
        <div class="paint-stage">
          <div class="paint-world">
            <div class="paint-layers"></div>
            <div class="paint-guide" hidden></div>
            <canvas class="paint-over" aria-hidden="true"></canvas>
            <canvas class="paint-selov" aria-hidden="true"></canvas>
          </div>
          <canvas class="paint-selui" aria-hidden="true"></canvas>
          <button type="button" class="paint-selx" hidden aria-label="Close the selection" data-tip="Close the selection (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
          <button type="button" class="paint-seldist" hidden aria-pressed="false" data-tip="Distort: drag each corner on its own"><svg class="sd-on" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.75 10.5V8a3.25 3.25 0 0 1 6.5 0v2.5"/></svg><svg class="sd-off" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.75 10.5V8a3.25 3.25 0 0 1 6.3-1.1"/></svg><span>Distort</span></button>
          <div class="paint-scale" role="group" aria-label="Scale" hidden><label for="paint-scale-in">Scale</label><input id="paint-scale-in" class="ps-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="6" value="100" data-tip="Type a size: 100% is its own size, 200% twice as big, 50% half (the arrow keys go up and down)"><i aria-hidden="true">%</i><button type="button" class="ps-lock" aria-pressed="true" aria-label="Keep proportions" data-tip="Keep proportions: the corners size it without stretching (hold Shift to stretch it)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 13.5a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M13.5 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/></svg></button></div>
        </div>
        <!-- THE BOTTOM BAR: size, undo, the two colours, redo, opacity -->
        <div class="paint-bottom" role="toolbar" aria-label="Brush and colour">
          <label class="pb-slider pb-size"><span>Size</span><input type="range" class="paint-size" min="0" max="1000" value="147" aria-label="Size"><output>6</output></label>
          <span class="pb-sep" aria-hidden="true"></span>
          <button type="button" data-act="undo" aria-label="Undo" data-tip="Undo (Ctrl+Z · two-finger tap)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H11"/></svg></button>
          <div class="paint-pair">
            <button type="button" class="paint-current" aria-label="Colour" aria-haspopup="dialog" aria-expanded="false"><span></span></button>
            <button type="button" class="paint-second" aria-label="Second colour" aria-haspopup="dialog" aria-expanded="false"><span></span></button>
            <button type="button" class="paint-swap" aria-label="Swap colours (X)" aria-keyshortcuts="X" data-tip="Swap colours (X)"><svg class="swap-cycle" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8.5a7.4 7.4 0 0 1 13 0M18.5 4.5v4h-4M18.5 15.5a7.4 7.4 0 0 1-13 0M5.5 19.5v-4h4"/></svg></button>
          </div>
