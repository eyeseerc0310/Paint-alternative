<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paint Alternative</title>
  <meta name="description" content="A free painting app that runs in your browser. Nothing is uploaded; Save downloads your picture.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paint">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // apply the light/dark choice before the page draws (no flash): the
    // visitor's own choice if they've made one, otherwise their device's
    var savedTheme = null;
    try { savedTheme = localStorage.getItem('theme-choice'); } catch (e) {}
    var wantDark = savedTheme ? savedTheme === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    if (wantDark) document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.classList.add('js');
    if (navigator.maxTouchPoints > 0) document.documentElement.classList.add('touch');
  </script>
</head>
<body>
  <!-- (the app's mark while it opens: it fades into the workspace once the drawing is back) -->
  <div class="app-splash" aria-hidden="true">
    <div class="splash-mark"><span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg></span><span class="splash-name">Paint Alternative</span></div>
    <div class="splash-wait"><i></i></div>
  </div>
  <header class="site-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg></span>
      <h1 class="brand-name">Paint Alternative</h1>
      <span class="doc-status" data-state="saved" role="status" data-tip="Your drawing is kept in this browser as you go. Use Save to download a copy"><i aria-hidden="true"></i><span>Saved</span></span>
    </div>
    <div class="header-tools" role="toolbar" aria-label="Picture">
      <button type="button" class="hb hb-install" data-hb="install" hidden aria-label="Install app" title="Install as an app"><svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><rect x="4.5" y="16.5" width="15" height="3.5" rx="1.2"/></svg><span>Install</span></button>
      <div class="hb-group hb-file" role="group" aria-label="File">
        <button data-tip="Gallery: all your drawings" type="button" class="hb" data-hb="gallery" aria-label="Gallery"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
        <button data-tip="New picture (N)" type="button" class="hb" data-hb="new" aria-label="New picture"><svg viewBox="0 0 24 24"><path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13.5 3.5V9H19"/><path d="M12 12.5v5M9.5 15h5"/></svg></button>
        <label class="hb paint-open" data-hb="open" data-tip="Open a picture, or a project (.paint)"><input type="file" accept="image/*,.paint" aria-label="Open a picture or a project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18v-8a1.5 1.5 0 0 0-1.5-1.5h-6.2L10.5 6H5.5A1.5 1.5 0 0 0 4 7.5z"/></svg></label>
        <button type="button" class="hb" data-act="save" aria-label="Save" aria-expanded="false" data-tip="Save: download as PNG, JPEG or a project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10.5"/><path d="M7.5 10L12 14.5 16.5 10"/><path d="M5 19.5h14"/></svg></button>
        <button data-tip="Share the picture" type="button" class="hb" data-hb="share" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="M8 7.5l4-4 4 4"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.5"/></svg></button>
      </div>
      <span class="hb-sep hb-file" aria-hidden="true"></span>
      <div class="hb-group hb-pic" role="group" aria-label="Picture">
        <button data-tip="Crop, rotate, flip and clear" type="button" class="hb" data-hb="image" aria-label="Crop, rotate and flip" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6.5 3v14.5H21"/><path d="M3 6.5h14.5V21"/></svg></button>
        <button data-tip="History: every step, to go back to" type="button" class="hb" data-hb="history" aria-label="History" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5v3.8h3.8"/><path d="M12 8v4.5l3 2"/></svg></button>
        <button type="button" class="hb" data-act="layers" aria-label="Layers" aria-expanded="false" data-tip="Layers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5"/><path d="M3.5 16.5L12 21l8.5-4.5" opacity=".6"/></svg></button>
      </div>
      <span class="hb-sep hb-view" aria-hidden="true"></span>
      <div class="hb-group hb-view" role="group" aria-label="View">
        <button type="button" class="hb" data-hb="focus" aria-label="Focus mode" aria-pressed="false" data-tip="Focus mode: just the picture (\)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/><path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg></button>
        <button data-tip="Keyboard shortcuts (?)" type="button" class="hb" data-hb="help" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2-2.4 3.6"/><path d="M12 17h.01"/></svg></button>
        <button class="theme-toggle" data-tip="Light or dark" type="button" aria-label="Switch to dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="icon-moon" d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>
          <g class="icon-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>
        </svg>
      </button>
      </div>
      <button type="button" class="hb hb-more" data-hb="more" aria-label="More" aria-expanded="false" data-tip="More"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg></button>
    </div>
  </header>
  <main class="site-main">
    <section class="paint" aria-label="Drawing">
      <div class="paint-bar paint-left" role="toolbar" aria-label="Tools">
        <div class="paint-group" role="group" aria-label="Draw">
          <button type="button" data-tool="brush" aria-label="Brush (B)" data-tip="Brush (B): paint freehand. Choose the brush in the tool panel" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg></button>
          <button type="button" data-tool="eraser" aria-label="Eraser (E)" data-tip="Eraser (E): rub out paint on the current layer"><svg viewBox="0 0 24 24"><path d="M8 20.5h12"/><path d="M5.3 15.3l8.9-8.9a2 2 0 0 1 2.8 0l2.6 2.6a2 2 0 0 1 0 2.8l-8.4 8.4a1 1 0 0 1-.7.3H8.4a1 1 0 0 1-.7-.3l-2.4-2.4a1.8 1.8 0 0 1 0-2.5z"/><path d="M9.4 11.2l5.4 5.4"/></svg></button>
          <button type="button" data-tool="fill" aria-label="Fill (F)" data-tip="Fill (F): tap to flood an area with colour"><svg viewBox="0 0 24 24"><path d="M10.6 4.2l7.7 7.7-6.4 6.4a2 2 0 0 1-2.8 0l-4.9-4.9a2 2 0 0 1 0-2.8z"/><path d="M4.6 12.4h13.2"/><path d="M10.6 4.2L8.4 2"/><path d="M20.5 15.2c.9 1.3 1.5 2.3 1.5 3.1a1.5 1.5 0 0 1-3 0c0-.8.6-1.8 1.5-3.1z"/></svg></button>
          <button type="button" data-tool="gradient" aria-label="Gradient (G)" data-tip="Gradient (G): drag to blend between your two colours"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 7a3 3 0 0 1 3-3h2v16H7a3 3 0 0 1-3-3z" fill="currentColor" stroke="none"/><path d="M9 4h3.5v16H9z" fill="currentColor" opacity=".55" stroke="none"/><path d="M12.5 4H16v16h-3.5z" fill="currentColor" opacity=".22" stroke="none"/></svg></button>
          <button type="button" data-tool="picker" aria-label="Colour picker (I)" data-tip="Colour picker (I): tap the picture to grab a colour. Or hold Alt (Option) with any tool"><svg viewBox="0 0 24 24"><path d="M14.6 4.6a2.7 2.7 0 0 1 3.8 0l1 1a2.7 2.7 0 0 1 0 3.8l-1.9 1.9.7.7-1.5 1.5-5.7-5.7 1.5-1.5.7.7z"/><path d="M11.9 9.6l-6.5 6.5a2 2 0 0 0-.6 1.4V19.2h1.7a2 2 0 0 0 1.4-.6l6.5-6.5"/></svg></button>
          <button type="button" class="paint-mirror" aria-pressed="false" aria-expanded="false" data-tip="Symmetry: whatever you draw is copied, mirrored or turned round a centre. Its settings open in the tool panel" aria-label="Symmetry"><svg viewBox="0 0 24 24"><path d="M12 3.5v17" stroke-dasharray="1.6 2.4"/><path d="M9 7L4 17h5z"/><path d="M15 7l5 10h-5z"/></svg></button>
        </div>
        <div class="paint-group" role="group" aria-label="Shapes and text">
          <button type="button" data-tool="line" aria-label="Line (L)" data-tip="Line (L): drag to draw a straight line"><svg viewBox="0 0 24 24"><path d="M7.2 16.8l9.6-9.6"/><circle cx="5.8" cy="18.2" r="2"/><circle cx="18.2" cy="5.8" r="2"/></svg></button>
          <button type="button" data-tool="shape" aria-label="Shapes (R)" data-tip="Shapes (R): drag to draw a shape. Pick the shape, and outline or filled, in the tool panel"><svg viewBox="0 0 24 24"><rect x="3.5" y="11.5" width="8" height="8" rx="1.5"/><circle cx="16" cy="8" r="4.5"/><path d="M16.5 14.5l4 6h-8z"/></svg></button>
          <button type="button" data-tool="text" aria-label="Text (T)" data-tip="Text (T): tap to type, or drag a box for the words to wrap in. The words go on a layer of their own, and stay editable: tap them again to change them"><svg viewBox="0 0 24 24"><path d="M5.5 7.5V5h13v2.5"/><path d="M12 5v14.5"/><path d="M9.5 19.5h5"/></svg></button>
          <button type="button" data-tool="pen" aria-label="Pen (P)" data-tip="Pen (P): click to place points joined by lines, drag to make curves. Click the first point to close the shape; Done (or Return) to finish"><svg viewBox="0 0 24 24"><path d="M12.5 4.2l6 6-2.7 6.3-7.6 3.3-3.4-3.4 3.3-7.6z"/><path d="M5 19l5.3-5.3"/><circle cx="11.6" cy="12.4" r="1.6"/></svg></button>
        </div>
        <div class="paint-group" role="group" aria-label="Retouch">
          <button type="button" data-tool="smudge" aria-label="Smudge (S)" data-tip="Smudge (S): push and blend colours together like a finger"><svg viewBox="0 0 24 24"><path d="M10 14.5V5.2a1.7 1.7 0 0 1 3.4 0V12"/><path d="M13.4 11a1.7 1.7 0 0 1 3.4 0v1"/><path d="M16.8 12a1.7 1.7 0 0 1 3.2.8V15a5.5 5.5 0 0 1-5.5 5.5h-1.2a5 5 0 0 1-3.9-1.9"/><path d="M3.5 16.5c1.5-1.2 3-1.2 4.5 0"/><path d="M3.5 20c1.5-1.2 3-1.2 4.5 0"/></svg></button>
          <button type="button" data-tool="blur" aria-label="Blur (U)" data-tip="Blur (U): soften the paint you brush over"><svg viewBox="0 0 24 24"><path d="M12 3.5c3 3.4 6 7 6 10.1a6 6 0 0 1-12 0c0-3.1 3-6.7 6-10.1z"/><path d="M9.2 14.2a2.9 2.9 0 0 0 2.6 2.7"/></svg></button>
          <button type="button" data-tool="tone" aria-label="Light and dark (O)" data-tip="Light &amp; dark (O): brush over the picture to lighten or darken it, like in a darkroom. Lighten or darken: in the tool panel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
          <button type="button" class="paint-adjust-btn" data-act="adjust" aria-expanded="false" aria-label="Effects (A)" data-tip="Effects (A): light, levels, curves, hue and saturation, white balance, gradient maps, sharpness and more, on the current layer (inside the selection, if there is one)"><svg viewBox="0 0 24 24"><path d="M4 7h8.5M17.5 7H20M4 12h2.5M11.5 12H20M4 17h10.5M19.5 17h.5"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="17" r="2.2"/></svg></button>
        </div>
        <div class="paint-group" role="group" aria-label="Select">
          <button type="button" data-tool="select" aria-label="Select and move (M)" data-tip="Select (M): drag a box, then move, copy, flip or cut it"><svg viewBox="0 0 24 24"><path d="M4 8.5V5a1 1 0 0 1 1-1h3.5M15.5 4H19a1 1 0 0 1 1 1v3.5M20 15.5V19a1 1 0 0 1-1 1h-3.5M8.5 20H5a1 1 0 0 1-1-1v-3.5"/><path d="M11 4h2M11 20h2M4 11v2M20 11v2"/></svg></button>
          <button type="button" data-tool="lasso" aria-label="Cutout (Q)" data-tip="Cutout (Q): drag to draw round something freehand, or click to place points joined by straight lines (drag between clicks for a freehand piece). Click the first point to finish"><svg viewBox="0 0 24 24"><path d="M7.4 15.6C5.3 14.5 4 12.8 4 10.9 4 7.4 7.6 4.5 12 4.5s8 2.9 8 6.4-3.6 6.4-8 6.4c-1 0-1.9-.1-2.8-.4" stroke-dasharray="2.4 2.1"/><circle cx="8.4" cy="16.4" r="1.4"/><path d="M8 17.8c-.6 1.2-.2 2.3 1 2.7"/></svg></button>
          <button type="button" data-tool="wand" aria-label="Magic wand (W)" data-tip="Magic wand (W): tap to pick out an area of one colour"><svg viewBox="0 0 24 24"><path d="M4.1 18.5l9-9a1.1 1.1 0 0 1 1.5 0l.4.4a1.1 1.1 0 0 1 0 1.5l-9 9a1.1 1.1 0 0 1-1.5 0l-.4-.4a1.1 1.1 0 0 1 0-1.5z"/><path d="M11.6 11l1.9 1.9"/><path d="M17.5 2.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/><path d="M9.5 3v2.5M8.25 4.25h2.5M20 11v2M19 12h2"/></svg></button>
          <button type="button" data-tool="move" aria-label="Move (V)" data-tip="Move (V): picks up everything on the layer (or the words of a text layer) to move, size or turn it. Drag anywhere to move it"><svg viewBox="0 0 24 24"><path d="M12 3.5v17M3.5 12h17"/><path d="M9.5 6L12 3.5 14.5 6M9.5 18l2.5 2.5 2.5-2.5M6 9.5L3.5 12 6 14.5M18 9.5l2.5 2.5-2.5 2.5"/></svg></button>
        </div>
        <div class="paint-group" role="group" aria-label="Navigate">
          <button type="button" data-tool="hand" aria-label="Move around (hold Space) (H)" data-tip="Move around (H): drag to pan the canvas, or hold Space"><svg viewBox="0 0 24 24"><path d="M8.5 12.5V6.5a1.5 1.5 0 0 1 3 0v4.5"/><path d="M11.5 10.5V5a1.5 1.5 0 0 1 3 0v5.5"/><path d="M14.5 10.5V6.5a1.5 1.5 0 0 1 3 0V14a6.5 6.5 0 0 1-6.5 6.5h-.4a5.6 5.6 0 0 1-4.5-2.3L4.2 15a1.5 1.5 0 0 1 2.3-1.9l2 2.3"/></svg></button>
          <button type="button" data-zoom="fit" class="paint-fitbtn" aria-label="Fit the picture (0)" data-tip="Fit (0): the whole picture, upright"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M3.5 8V5a1.5 1.5 0 0 1 1.5-1.5h3M16 3.5h3A1.5 1.5 0 0 1 20.5 5v3M20.5 16v3a1.5 1.5 0 0 1-1.5 1.5h-3M8 20.5H5A1.5 1.5 0 0 1 3.5 19v-3"/></svg></button>
        </div>
      </div>
      <div class="paint-stage">
        <div class="paint-world">
          <div class="paint-layers"></div>
          <div class="paint-guide" hidden></div>
          <canvas class="paint-over" aria-hidden="true"></canvas>
          <canvas class="paint-selov" aria-hidden="true"></canvas>
        </div>
        <button type="button" class="paint-selx" hidden aria-label="Close the selection" data-tip="Close the selection (Esc)"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
        <div class="paint-ctx" role="toolbar" aria-label="Tool options"><span class="ctx-grip" aria-hidden="true" data-tip="Drag to move (double-click: back to its place)"></span><div class="ctx-tool"></div>
        <div class="paint-selbar" hidden><button type="button" data-sel="copy" data-tip="Copy it onto a new layer, ready to move">Copy</button><button type="button" data-sel="fliph" data-tip="Flip left to right">Flip &#8596;</button><button type="button" data-sel="flipv" data-tip="Flip upside down">Flip &#8597;</button><button type="button" data-sel="rot90" data-tip="Turn a quarter turn (or drag the round handle)">Turn 90°</button><button type="button" data-sel="invert" data-tip="Invert the colours (or right-click the selection)">Invert</button><button type="button" data-sel="delete" data-tip="Delete what's selected (Delete)">Delete</button><button type="button" data-sel="layer" data-tip="Cut it out onto a layer of its own">Cut to Layer</button><button type="button" data-sel="done" data-tip="Put it down (Enter)">Done</button></div><button type="button" class="ctx-min" aria-expanded="true" aria-label="Hide the tool settings" data-tip="Hide the tool settings"><svg class="cm-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg><svg class="cm-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
      </div>
      <div class="paint-bar paint-right" role="toolbar" aria-label="Colour and brush">
        <section class="pr-sec" data-sec="colour">
          <button type="button" class="pr-head" aria-expanded="true" data-tip="Show or hide the colours"><span>Colour</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4 4 4-4"/></svg></button>
          <div class="pr-body"><div class="pr-in">
            <div class="paint-group paint-colors" role="group" aria-label="Colour">
              <div class="paint-pair">
            <button type="button" class="paint-current" data-tip="Colour: tap to choose, or drag onto the picture to fill" aria-label="Colour" aria-haspopup="dialog" aria-expanded="false"><span></span></button>
            <button type="button" class="paint-second" data-tip="Second colour (for gradients): tap to choose, or drag onto the picture to fill" aria-label="Second colour" aria-haspopup="dialog" aria-expanded="false"><span></span></button>
            <button type="button" class="paint-swap" aria-label="Swap colours (X)" data-tip="Swap colours (X)"><svg viewBox="0 0 24 24"><path d="M6.5 6.5A11 11 0 0 1 17.5 17.5"/><path d="M9.5 3.8L6.5 6.5l3 2.9"/><path d="M14.6 14.5l2.9 3 2.7-3"/></svg></button>
          </div>
              <div class="paint-swatches"></div>
              <div class="paint-recent" aria-label="Recent colours"></div>
            </div>
          </div></div>
        </section>
        <section class="pr-sec" data-sec="brush">
          <button type="button" class="pr-head" aria-expanded="true" data-tip="Show or hide size and opacity"><span class="pr-tool">Brush</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4 4 4-4"/></svg></button>
          <div class="pr-body"><div class="pr-in">
            <div class="paint-group paint-sliders">
              <label data-tip="Size ([ and ])"><span>Size</span><input type="range" class="paint-size" min="0" max="1000" value="147" aria-label="Size"><output>6</output></label>
          <label data-tip="Opacity"><span>Opacity</span><input type="range" class="paint-alpha" min="5" max="100" value="100"><output>100</output></label>
            </div>
          </div></div>
        </section>
        <div class="paint-group pr-history" role="group" aria-label="Undo and redo">
          <button type="button" data-act="undo" aria-label="Undo" data-tip="Undo (Ctrl+Z · two-finger tap)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H11"/></svg></button>
          <button type="button" data-act="redo" aria-label="Redo" data-tip="Redo (Ctrl+Y · three-finger tap)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l4.5 4.5L15 16"/><path d="M19 11.5H9.5a5 5 0 0 0 0 10H13"/></svg></button>
        </div>
        <div class="paint-zoom" role="group" aria-label="Zoom"><button type="button" data-zoom="out" aria-label="Zoom out" data-tip="Zoom out (−)">&#8722;</button><button type="button" data-zoom="fit" class="paint-zoom-val" data-tip="Fit (0)">100%</button><button type="button" data-zoom="in" aria-label="Zoom in" data-tip="Zoom in (+)">+</button></div>
      </div>
    </section>
  </main>

    // works offline, and can be installed as an app
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  </script>
